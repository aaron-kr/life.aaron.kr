title: Job search — general reminders
group: Jobs
items:
  - text: "Request 경력증명서 from every current school during final exam week"
    meta: "1차 hiring often opens right after the semester ends — grab it while portal access still works, don't wait"
    urgent: true
  - text: "If already no longer employed: call 교무처/인사팀 directly, ask them to email or fax 경력증명서"
    meta: "it's a record of past employment, not current status — schools can and do still issue it after your contract ends; portal access being cut off doesn't cut off your right to request the document"
  - text: "Keep a standing folder of every school's HR/교무처 phone + email"
    meta: "so you're not hunting for contact info after you've already lost portal access"
  - text: "Update résumé PDF in Google Drive"
  - text: "Check 하이브레인넷 / 나라일터 / 워크넷 for new 전임강사·시간강사 postings"
    meta: "filter for 컴공/IT/AI, 영어가능 우대"
  - text: "Review this week's Google Alert results for 강사 채용"
