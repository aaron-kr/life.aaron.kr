# Recurring weekly schedule blocks — drives the Week view grid.
# Weekday→city mapping (for weather) lives in _data/weather.yml, not here.
# University/weekday mapping for schools lives in course-sources.yml.

# type maps to a CSS class (b-<type>) — see app/globals.css for the palette:
# class, family, church, deepwork, gym, commute, nophone
# `university:` (a courses.aaron.kr universities.yml abbr) puts that school's
# logo inline in the block. `color:` (a CSS var name, e.g. "--pink") overrides
# the type's default palette color — set your own per block if you want each
# school's block to match its logo's color.
