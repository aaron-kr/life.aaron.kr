# Recurring transportation-ticket needs. The drawer groups these into a
# rolling 4-week window (This week / Next week / 3-4 weeks out) computed from
# today's date — nothing here is date-specific, `weekday` + `opens_before_days`
# is enough to derive it each week.
routes:
  # 월요일 MONDAY
  - id: mon-to-osong
    weekday: monday
    route: "KTX → 오송, Mon 06:25am"
    short: "Mon am KTX"
    opens_before_days: 30
    urgent_within_days: 7

  - id: mon-to-chungju
    weekday: monday
    route: "무궁화 → 충주, Mon 07:30am"
    short: "Mon am 무궁화"
    opens_before_days: 30
    urgent_within_days: 7

  - id: mon-from-chungju
    weekday: monday
    route: "무궁화 → 오송, Mon 17:44pm"
    short: "Mon pm 무궁화"
    opens_before_days: 30
    urgent_within_days: 7

  - id: mon-from-osong
    weekday: monday
    route: "KTX → 전주, Mon 19:56pm"
    short: "Mon pm KTX"
    opens_before_days: 30
    urgent_within_days: 7

  # 수요일 WEDNESDAY
  - id: wed-to-iksan
    weekday: wednesday
    route: "전주 → 익산, Wed 12:31, 13:39(ITX) / 13:17, 13:50, 14:03(KTX)"
    short: "Jeonju Tue"
    opens_before_days: 30
    urgent_within_days: 7

  - id: wed-from-iksan
    weekday: wednesday
    route: "익산 → 전주, Wed 18:40(무궁화) / 18:05, 19:00(KTX)"
    short: "Jeonju Tue"
    opens_before_days: 30
    urgent_within_days: 7

  # 목요일 THURSDAY

